[package]
name = "tch-data"
version = "0.1.0"
edition = "2021"
description = "High-performance Parquet → PyTorch sequence data loaders (tch-rs / PyO3), inspired by torchdata"
license = "MIT"
repository = "https://github.com/jmalicki/tch-data-rs"
readme = "README.md"
keywords = ["pytorch", "tch", "parquet", "dataloader", "lstm"]
categories = ["science", "asynchronous"]
rust-version = "1.70"

[lib]
name = "tch_data"
# cdylib: Python extension module (`import tch_data`)
# rlib: usable from other Rust crates and `cargo test`
crate-type = ["cdylib", "rlib"]

[dependencies]
num = "0.4"
parquet = "40"
pyo3 = { version = "0.18" }
tch = { version = "0.13.0", features = ["python-extension"] }
thiserror = "1.0"
crossbeam-channel = "0.5"
threadpool = "1.8"
par-map = "0.1"

[features]
# Enable when building the Python extension (maturin / setuptools-rust).
# Disable for plain `cargo test` / Rust-only use so the linker does not
# require a Python shared library.
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]
